[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmos20"
version = "0.1.0"
description = "Interactive 20-level idealized boreal-summer atmospheric circulation model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zhu Chenyu"}]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "gradio>=5.0",
  "Pillow>=10.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atmos20 = ["data/*.npz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
