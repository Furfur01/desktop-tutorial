name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: pytest
      - run: python scripts/prerender_profiles.py matrix --select all --hosted-only
      - run: python scripts/validate_prerender.py web/assets/prerender/manifest.json
      - run: node --check web/enhancements.js
