name: build pre-render library

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Comma-separated profile IDs, or all"
        required: true
        default: "circulation-long-equinox-90d,baroclinic-north-10d"
        type: string
      publish:
        description: "Commit completed bundles and catalog back to this branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: atmos20-prerender-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: matrix
        env:
          SELECTED_PROFILES: ${{ inputs.profiles }}
        run: |
          python scripts/prerender_profiles.py matrix \
            --select "$SELECTED_PROFILES" \
            --hosted-only \
            --github-output "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Atmos20
        run: python -m pip install -e .
      - name: Render ${{ matrix.profile }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          CORES="$(nproc)"
          export OMP_NUM_THREADS="$CORES"
          export OPENBLAS_NUM_THREADS="$CORES"
          export MKL_NUM_THREADS="$CORES"
          echo "Runner exposes $CORES logical CPUs"
          python scripts/prerender_profiles.py render \
            --profile "$PROFILE" \
            --output-root "$RUNNER_TEMP/prerenders"
      - name: Validate real frame motion
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python scripts/validate_prerender.py \
            "$RUNNER_TEMP/prerenders/$PROFILE/manifest.json"
      - uses: actions/upload-artifact@v7
        with:
          name: prerender-${{ matrix.profile }}
          path: ${{ runner.temp }}/prerenders/${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: ${{ needs.render.result == 'success' && inputs.publish && github.ref_type == 'branch' }}
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: prerender-*
          path: ${{ runner.temp }}/downloaded-prerenders
      - name: Install published bundles
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=("$RUNNER_TEMP"/downloaded-prerenders/prerender-*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No pre-render artifacts were downloaded" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            profile="${name#prerender-}"
            source="$artifact"
            if [[ ! -f "$source/manifest.json" && -f "$source/$profile/manifest.json" ]]; then
              source="$source/$profile"
            fi
            if [[ ! -f "$source/manifest.json" ]]; then
              echo "Artifact $name does not contain a manifest at a supported depth" >&2
              find "$artifact" -maxdepth 2 -type f -print >&2
              exit 1
            fi
            target="web/assets/prerenders/$profile"
            rm -rf "$target"
            mkdir -p "$target"
            cp -a "$source"/. "$target"/
          done
          python scripts/prerender_profiles.py catalog
      - name: Commit catalog and media
        env:
          SELECTED_PROFILES: ${{ inputs.profiles }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/prerenders
          if git diff --cached --quiet; then
            echo "Generated bundles are already up to date"
            exit 0
          fi
          git commit -m "chore(prerender): publish ${SELECTED_PROFILES}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
